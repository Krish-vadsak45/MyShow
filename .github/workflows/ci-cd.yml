name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      pipeline: ${{ steps.filter.outputs.pipeline }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            pipeline:
              - '.github/workflows/**'
              - 'docker-compose.yml'
            any:
              - 'backend/**'
              - 'frontend/**'
              - '.github/workflows/**'
              - 'docker-compose.yml'

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    needs: changes
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if no backend changes
        if: needs.changes.outputs.backend != 'true' && needs.changes.outputs.pipeline != 'true'
        run: echo "Skipping backend CI"

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.pipeline == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.pipeline == 'true'
        run: npm ci

      - name: Secret Scan
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.pipeline == 'true'
        shell: bash
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks git --verbose "${GITHUB_WORKSPACE}"

      - name: Test
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.pipeline == 'true'
        run: npm test

      - name: Build Vercel Backend
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          npm install --global vercel
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.BACKEND_PROJECT_ID }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
          INNGEST_SIGNING_KEY: ${{ secrets.INNGEST_SIGNING_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NODE_ENV: production
          PORT: 3000

      - name: Upload artifact
        if: (needs.changes.outputs.backend == 'true' || needs.changes.outputs.pipeline == 'true') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-vercel-dist
          path: backend/.vercel/output
          if-no-files-found: error

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: changes
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Skip if no frontend changes
        if: needs.changes.outputs.frontend != 'true' && needs.changes.outputs.pipeline != 'true'
        run: echo "Skipping frontend CI"

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.pipeline == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.pipeline == 'true'
        run: npm ci

      - name: Format check
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.pipeline == 'true'
        run: npx prettier --check .

      - name: Lint
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.pipeline == 'true'
        run: npm run lint

      - name: Build Frontend
        if: github.ref == 'refs/heads/main'
        run: npm run build
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_TMDB_IMAGE_BASE_URL: ${{ secrets.VITE_TMDB_IMAGE_BASE_URL }}
          VITE_CURRENCY: ${{ secrets.VITE_CURRENCY }}

      - name: Upload artifact
        if: (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.pipeline == 'true') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  # We are now using Vercel native flow. Docker job is kept but can be disabled if not needed for other registries.
  docker:
    name: Build & Security Audit
    runs-on: ubuntu-latest
    needs: [changes, backend-ci, frontend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.any == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write

    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: ${{ github.repository_owner }}/myshow-backend
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: ${{ github.repository_owner }}/myshow-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist for Docker
        if: matrix.service == 'frontend'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (single build)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Security scan (fail on vuln)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Push image (only if safe)
        if: success()
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Download backend prebuilt
        uses: actions/download-artifact@v4
        with:
          name: backend-vercel-dist
          path: backend/.vercel/output

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Deploy Backend to Vercel
        working-directory: backend
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.BACKEND_PROJECT_ID }}

      - name: Deploy Frontend to Vercel
        working-directory: frontend
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.FRONTEND_PROJECT_ID }}

      - name: Health check
        run: |
          echo "Starting health check..."
          # Retry 5 times, every 10 seconds
          for i in {1..5}; do
            if curl --fail -s https://myshow-production.vercel.app/api/health; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Health check failed, retrying in 10s... ($i/5)"
            sleep 10
          done
          echo "Health check failed after 5 attempts."
          exit 1
